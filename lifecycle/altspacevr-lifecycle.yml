description: >-
  AltspaceVR was a social VR platform founded in 2013, acquired by Microsoft in
  2017 and folded into the Mixed Reality division. In January 2023 Microsoft
  announced the platform would close permanently, and it shut down on
  2023-03-10, with Microsoft redirecting its efforts to Microsoft Mesh. This
  lifecycle record exists so the network correctly represents AltspaceVR as a
  terminated platform with no live API surface, rather than as an unenriched
  lead.
