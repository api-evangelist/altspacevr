aid: altspacevr
name: AltspaceVR
description: 'AltspaceVR was a social virtual reality platform founded in 2013 where
  people gathered in shared 3D spaces for live events, meetups, classes, comedy shows
  and conferences. Google Ventures (GV) was an early investor. Microsoft acquired the
  company in 2017 and folded it into its Mixed Reality division, then announced in
  January 2023 that the platform would close, shutting it down permanently on 2023-03-10
  in favor of Microsoft Mesh. AltspaceVR published no hosted HTTP API; its developer
  surface was the Mixed Reality Extension (MRE) SDK for building server-hosted 3D world
  extensions in Node.js, plus the earlier web-based AltspaceSDK. Every SDK repository
  is now archived and altvr.com redirects to microsoft.com. This profile is retained
  as a historical record of a terminated platform, not as a live integration target.'
